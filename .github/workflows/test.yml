name: Test

# Runs the end-to-end suite against this commit's app/, served locally on the runner.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Serve app/
        run: |
          python3 -m http.server 8000 -d app >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://localhost:8000/ >/dev/null && break; sleep 0.5; done
      - run: node tests/e2e.mjs http://localhost:8000/ test-output
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-local
          path: test-output
      # Screenshots and results.json also go to the test-results branch (one commit, replaced
      # each run) so they can be viewed without downloading the artifact.
      - name: Publish results to the test-results branch
        if: always() && github.event_name != 'pull_request'
        run: |
          cd test-output
          git init -q -b test-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '# Test results\n\nCommit %s on %s, run %s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" > README.md
          git add -A && git commit -qm "Test results for $GITHUB_SHA"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" test-results
