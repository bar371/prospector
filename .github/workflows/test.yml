name: Test

# Runs the end-to-end suite against this commit's app/, served locally on the runner.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Serve app/
        run: |
          python3 -m http.server 8000 -d app >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://localhost:8000/ >/dev/null && break; sleep 0.5; done
      - run: node tests/e2e.mjs http://localhost:8000/ test-output
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-local
          path: test-output
