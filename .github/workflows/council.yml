name: Council

# Council meetings: find meetings about the test areas, transcribe the relevant parts and
# publish quotes with timestamps. Runs on GitHub's runners; output goes to the council-build branch.
on:
  push:
    branches-ignore: [main]
    paths: ['pipeline/council/**', '.github/workflows/council.yml']
  workflow_dispatch:
    inputs:
      max_items:
        description: 'Agenda items to transcribe per area'
        required: false
        default: '8'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: pip install -q faster-whisper==1.1.1 requests
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small
      - run: python pipeline/council/build.py out/council
        env:
          MAX_ITEMS: ${{ github.event.inputs.max_items || '8' }}
      - name: Publish to the council-build branch
        if: always()
        run: |
          cd out
          git init -q -b council-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Council build for $GITHUB_SHA"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" council-build
