name: Enrich

# Address-level value drivers (pipeline/enrich.py) on top of the village build; adds enrich.json files to village-build.
on:
  push:
    branches-ignore: [main]
    paths: ['pipeline/enrich.py', '.github/workflows/enrich.yml']
  workflow_dispatch:
    inputs:
      villages:
        description: 'Comma-separated village keys to enrich (empty = hazerswoude-rijndijk)'
        required: false
        default: ''

concurrency: village-build

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Start from the village build
        run: |
          mkdir -p out/village
          git fetch -q origin village-build
          git archive origin/village-build | tar -x -C out/village
      - run: pip install -q shapely==2.0.6
      - run: python pipeline/enrich.py out/village
        env:
          VILLAGES: ${{ github.event.inputs.villages || 'hazerswoude-rijndijk' }}
          EP_ONLINE_API_KEY: ${{ secrets.EP_ONLINE_API_KEY }}
      - name: Publish to the village-build branch
        if: always()
        run: |
          cd out/village
          git init -q -b village-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Village build + enrichment for $GITHUB_SHA"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" village-build
