name: Village

# Building- and street-level data for whole villages (pipeline/village.py),
# published to the village-build branch for review.
on:
  push:
    branches-ignore: [main]
    paths: ['pipeline/village.py', '.github/workflows/village.yml']
  workflow_dispatch:
    inputs:
      villages:
        description: 'Comma-separated village keys to build (empty = all)'
        required: false
        default: ''

concurrency: village-build

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Start from the previous build, so building one village keeps the others
        run: |
          mkdir -p out/village
          if git ls-remote --exit-code origin village-build >/dev/null; then
            git fetch -q origin village-build
            git archive origin/village-build | tar -x -C out/village
          fi
      - run: pip install -q shapely==2.0.6
      - run: python pipeline/village.py out/village
        env:
          VILLAGES: ${{ github.event.inputs.villages }}
      - name: Publish to the village-build branch
        if: always()
        run: |
          mkdir -p out/village && cd out/village
          rm -rf .git
          git init -q -b village-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '# Village build\n\nCommit %s, run %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > README.md
          git add -A && git commit -qm "Village build for $GITHUB_SHA"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" village-build
